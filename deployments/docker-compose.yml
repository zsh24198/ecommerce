  name: ecommerce
  services:
    mysql:
      image: mysql:8.0
      container_name: ecommerce-mysql
      restart: unless-stopped
      ports:
        - "3306:3306"
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
        MYSQL_DATABASE: ecommerce
        MYSQL_USER: ecommerce
        MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce123456}
      volumes:
        - ecommerce-data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]        
        interval: 5s
        timeout: 3s
        retries: 10
    redis:
      image: redis:7.2-alpine
      container_name: ecommerce-redis
      restart: unless-stopped
      ports:
        - "6379:6379"
      command: redis-server --requirepass ${REDIS_PASSWORD:-redis123456} --save "" --appendonly no
      healthcheck:
        test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:-redis123456} ping"]
        interval: 5s
        timeout: 3s
        retries: 10

    kafka:
      image: apache/kafka:3.7.1
      container_name: ecommerce-kafka
      restart: unless-stopped
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_LOG_DIRS: /var/lib/kafka/data
      volumes:
        - kafka-data:/var/lib/kafka/data
      healthcheck:
        test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]
        interval: 10s
        timeout: 5s
        retries: 10

  volumes:
    ecommerce-data:
    kafka-data: