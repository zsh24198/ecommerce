  name: ecommerce
  services:
    mysql:
      image: mysql:8.0
      container_name: ecommerce-mysql
      restart: unless-stopped
      ports:
        - "3306:3306"
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
        MYSQL_DATABASE: ecommerce
        MYSQL_USER: ecommerce
        MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce123456}
      volumes:
        - ecommerce-data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]        
        interval: 5s
        timeout: 3s
        retries: 10
    redis:
      image: redis:7.2-alpine
      container_name: ecommerce-redis
      restart: unless-stopped
      ports:
        - "6379:6379"
      command: redis-server --requirepass ${REDIS_PASSWORD:-redis123456} --save "" --appendonly no
      healthcheck:
        test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:-redis123456} ping"]
        interval: 5s
        timeout: 3s
        retries: 10

    kafka:
      image: apache/kafka:3.7.1
      container_name: ecommerce-kafka
      restart: unless-stopped
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_LOG_DIRS: /var/lib/kafka/data
        # 降维：JVM 堆缩到 256m（开发环境零负载够用），日志保留 1 小时
        KAFKA_HEAP_OPTS: '-Xmx256m -Xms128m'
        KAFKA_LOG_RETENTION_HOURS: 1
      volumes:
        - kafka-data:/var/lib/kafka/data
      healthcheck:
        test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]
        interval: 10s
        timeout: 5s
        retries: 10

    prometheus:
      image: prom/prometheus:v2.53.0
      container_name: ecommerce-prometheus
      restart: unless-stopped
      ports:
        - "9090:9090"
      extra_hosts:
        - "host.docker.internal:host-gateway"
      volumes:
        - ./prometheus:/etc/prometheus
        - prometheus-data:/prometheus
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.retention.time=3d'

    grafana:
      image: grafana/grafana:11.1.0
      container_name: ecommerce-grafana
      restart: unless-stopped
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123456}
      volumes:
        - grafana-data:/var/lib/grafana
        - ./grafana/provisioning:/etc/grafana/provisioning
      depends_on:
        - prometheus

  volumes:
    ecommerce-data:
    kafka-data:
    prometheus-data:
    grafana-data: