  name: ecommerce
  services:
    mysql:
      image: mysql:8.0
      container_name: ecommerce-mysql
      restart: unless-stopped
      ports:
        - "3306:3306"
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
        MYSQL_DATABASE: ecommerce
        MYSQL_USER: ecommerce
        MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce123456}
      volumes:
        - ecommerce-data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]        
        interval: 5s
        timeout: 3s
        retries: 10
    redis:
      image: redis:7.2-alpine
      container_name: ecommerce-redis
      restart: unless-stopped
      ports:
        - "6379:6379"
      command: redis-server --requirepass ${REDIS_PASSWORD:-redis123456} --save "" --appendonly no
      healthcheck:
        test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:-redis123456} ping"]
        interval: 5s
        timeout: 3s
        retries: 10

  volumes:
    ecommerce-data: